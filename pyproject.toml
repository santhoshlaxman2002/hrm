[project]
name = "hrm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "."
]
